[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-analysis-system"
description = "Computer-vision pipeline for tennis video analysis: tracking, court mapping and shot events."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Emanuele Stopponi" }]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[project.scripts]
tennis-analysis = "tennis_analysis.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tennis_analysis.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["tennis_analysis*"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["training", "analysis"]

[tool.ruff.lint]
# Correctness checks only: pyflakes plus the syntax/import errors of pycodestyle.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# __init__ modules re-export the public API.
"__init__.py" = ["F401"]
